name: LLM Tests

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A fork has no access to the secret, so a scheduled run there would only ever fail.
    if: github.repository_owner == 'tomsquest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # frozen: v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # frozen: v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # frozen: v4

      - run: just test-llm
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
