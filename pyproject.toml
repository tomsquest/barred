[project]
name = "barred"
version = "0.3.0"
description = "Unofficial implementation of BARRED: generate faithful, diverse labeled datasets"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
]
authors = [
    { name = "Thomas Queste", email = "tom@tomsquest.com" },
]
requires-python = ">=3.12"
keywords = [
    "llm",
    "synthetic-data",
    "dataset-generation",
    "data-labeling",
    "guardrails",
    "multi-agent-debate",
    "classification",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "any-llm-sdk>=1.26.0,<2",
    "pydantic>=2.13.4,<3",
]

[project.urls]
Homepage = "https://github.com/tomsquest/barred"
Repository = "https://github.com/tomsquest/barred"
Changelog = "https://github.com/tomsquest/barred/releases"
Issues = "https://github.com/tomsquest/barred/issues"
Paper = "https://arxiv.org/abs/2604.25203"

[dependency-groups]
dev = [
    "any-llm-sdk[anthropic,gemini,openai,openrouter]>=1.26.0",
    "genai-prices>=0.1.4",
    "ipykernel>=7.3.0",
    "prek>=0.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-pretty>=1.3.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[build-system]
requires = [
    "uv_build>=0.12.5,<0.13.0",
]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--no-header",
    "-ra",
    "-vv",
    "--ff",
    "--tb=short",
    "--disable-warnings",
    "-m",
    "not llm",
]
markers = [
    "llm: test involving LLM calls",
]

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "CPY001",
    "COM812",
    "D",
    "TID",
    "E501",
    "G004",
    "TRY300",
    "SIM108",
    "PLR2004",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.extend-per-file-ignores]
"*_test.py" = [
    "ANN",
    "S101",
    "PLR2004",
]
"conftest.py" = [
    "T201",
]
"notebooks/*.ipynb" = [
    "BLE001",
    "E402",
    "EM101",
    "ERA001",
    "INP001",
    "S110",
    "T201",
    "TRY003",
]

[tool.ty.terminal]
error-on-warning = true
